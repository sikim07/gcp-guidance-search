  <body>
    <h1 data-law-id="011794" data-enforcement="2025-02-21">
      의약품 등의 안전에 관한 규칙 [별표 4] 의약품 임상시험 관리기준
    </h1>
    <p class="enforcement">시행 2025-02-21</p>
    <div class="article" data-article="1">
      제1호 목적 이 기준은 의약품 임상시험을 과학적이고 윤리적으로 실시하기 위한 기준을
      정한다.
    </div>
    <div class="article" data-article="5">
      제5호 시험대상자 동의 시험책임자는 임상시험 실시 전에 시험대상자 또는 대리인의 서면
      동의를 받아야 한다.
    </div>
  </body>
